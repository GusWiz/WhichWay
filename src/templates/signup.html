<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="stylesheet" href="/frontend/static/style.css" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <title>WhichWay Sign-In</title>
  </head>

  <body>
    <div class="wrapper">
      <form action="signup_page.js" method="POST">
        <h1>Which Way Signup</h1>
        <div class="input-box">
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Full Name"
            required
          />
        </div>

        <div class="input-box">
          <input
            type="text"
            id="email"
            name="email"
            placeholder="Email"
            required
          />
        </div>

        <div class="input-box">
          <input
            type="text"
            id="user_name"
            name="user_name"
            placeholder="Username"
            required
          />
        </div>

        <div class="input-box">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
          />
        </div>

        <button type="submit" class="btn">Signup</button>

        <div class="register-link">
          <p>
            Already have an account?
            <a href="/frontend/templates/login.html">Log in</a>
          </p>
        </div>
      </form>
    </div>

    <div></div>
  </body>
</html>
