<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="stylesheet" href="/frontend/static/style.css" />
    <title>Forgot Password</title>
  </head>

  <body>
    <div class="wrapper">
      <form action="forgot_password.js" method="POST">
        <h1>Reset Password</h1>
        <div class="input-box">
          <input
            type="text"
            id="email"
            name="email"
            placeholder="Email"
            required
          />
          <button type="submit" class="btn">Send Verification Code</button>
        </div>
      </form>
    </div>
  </body>
</html>
