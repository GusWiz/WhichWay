<html>
  <head>
    <title>WhichWay Login</title>
  </head>

  <body>
    <div>
      <h1>Login</h1>
    </div>

    <div>
      <form action="login_page.js" method="POST">
        <div>
          <input
            type="text"
            id="user_name"
            name="user_name"
            placeholder="Username"
            required
          />
        </div>

        <br />

        <div>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
          />
        </div>

        <br />
      </form>
      <button id="login" type="submit" onClick="">Login</button><br /><br />
      <button id="sign_up" type="submit" onClick="">Sign up</button>
      <button id="forgot_password" type="submit" onClick="">
        Forgot Password
      </button>
    </div>

    <div></div>
  </body>
</html>
